<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTask</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>SmartTask</h1>
        <p>Gestionnaire de tâches</p>

        <button id="checkBackend">Tester le backend</button>
        <p id="result"></p>

        <hr>

        <h2>Mes tâches</h2>

        <div class="task-form">
            <input
                type="text"
                id="taskTitle"
                placeholder="Nouvelle tâche..."
            >
            <button id="addTask">Ajouter</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>

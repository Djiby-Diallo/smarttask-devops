services:

  frontend:
    image: djibydiallo/smarttask-frontend:latest
    container_name: smarttask-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - smarttask-network

  backend:
    image: djibydiallo/smarttask-backend:latest
    container_name: smarttask-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: smarttask
      DB_USER: smarttask
      DB_PASSWORD: smarttask_password
    depends_on:
      database:
        condition: service_healthy
    networks:
      - smarttask-network

  database:
    image: mysql:9.7
    container_name: smarttask-database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smarttask
      MYSQL_USER: smarttask
      MYSQL_PASSWORD: smarttask_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - smarttask-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smarttask-network

networks:
  smarttask-network:
    driver: bridge

volumes:
  smarttask-db-data:
